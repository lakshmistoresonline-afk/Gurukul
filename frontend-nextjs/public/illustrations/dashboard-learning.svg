<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" rx="32" fill="#F7F8FA"/>
  <!-- Decorative Circles -->
  <circle cx="120" cy="100" r="80" fill="#0F766E" fill-opacity="0.08"/>
  <circle cx="700" cy="400" r="120" fill="#4F46E5" fill-opacity="0.06"/>
  <circle cx="650" cy="120" r="60" fill="#F59E0B" fill-opacity="0.1"/>

  <!-- Desk & Laptop -->
  <rect x="220" y="340" width="360" height="20" rx="10" fill="#CBD5E1"/>
  <rect x="280" y="220" width="240" height="130" rx="16" fill="#0F172A"/>
  <rect x="290" y="230" width="220" height="110" rx="10" fill="#0F766E"/>

  <!-- Dashboard Screen Graphics -->
  <rect x="305" y="245" width="90" height="50" rx="8" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="405" y="245" width="90" height="50" rx="8" fill="#4F46E5" fill-opacity="0.8"/>
  <rect x="305" y="305" width="190" height="25" rx="6" fill="#F59E0B" fill-opacity="0.9"/>

  <!-- Student Character -->
  <circle cx="180" cy="230" r="35" fill="#FDBA74"/>
  <path d="M145 320 C145 270 215 270 215 320 Z" fill="#0F766E"/>
  <path d="M155 200 C155 180 205 180 205 200 Z" fill="#1E293B"/>

  <!-- Floating Elements -->
  <g transform="translate(140, 100)">
    <rect width="70" height="50" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/>
    <text x="35" y="30" font-family="sans-serif" font-weight="900" font-size="20" fill="#0F766E" text-anchor="middle">A+</text>
  </g>
  <g transform="translate(580, 200)">
    <rect width="80" height="60" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
    <text x="40" y="38" font-family="sans-serif" font-weight="900" font-size="22" fill="#F59E0B" text-anchor="middle">🎯 100</text>
  </g>
</svg>
