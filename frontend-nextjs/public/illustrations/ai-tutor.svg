<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" rx="32" fill="#F7F8FA"/>

  <!-- Robot Head & Body -->
  <g transform="translate(400, 220)">
    <rect x="-80" y="-100" width="160" height="130" rx="30" fill="#0F766E"/>
    <rect x="-65" y="-85" width="130" height="100" rx="20" fill="#0F172A"/>
    <!-- Glowing Robot Eyes -->
    <circle cx="-30" cy="-35" r="16" fill="#38BDF8"/>
    <circle cx="30" cy="-35" r="16" fill="#38BDF8"/>
    <!-- Friendly Smile -->
    <path d="M-25 -5 Q0 15 25 -5" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>

    <!-- Antenna -->
    <rect x="-6" y="-130" width="12" height="30" rx="6" fill="#0F766E"/>
    <circle cx="0" cy="-135" r="14" fill="#F59E0B"/>

    <!-- Body Base -->
    <path d="M-100 80 C-100 40 100 40 100 80 Z" fill="#0F766E"/>
  </g>

  <!-- Chat Bubbles -->
  <g transform="translate(120, 100)">
    <rect width="200" height="70" rx="20" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/>
    <text x="100" y="42" font-family="sans-serif" font-weight="800" font-size="16" fill="#0F766E" text-anchor="middle">How can I help you?</text>
  </g>

  <g transform="translate(480, 80)">
    <rect width="220" height="70" rx="20" fill="#4F46E5"/>
    <text x="110" y="42" font-family="sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle">Solve 10 - -17 = 27 📐</text>
  </g>
</svg>
